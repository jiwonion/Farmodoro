<!doctype html>
<html lang="en">
<meta charset="utf-8">
<base href="../../">
<title>Farmodoro creation art review</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#eef5ff;color:#122650;font:16px system-ui,sans-serif}h1{margin:0 0 10px;font-size:26px}p{margin:6px 0 16px}.atlas{display:grid;grid-template-columns:155px repeat(4,1fr);gap:8px;max-width:1100px}.heading{font-weight:650;text-align:center;padding:8px}.label{display:flex;align-items:center;font-weight:650}.frame{height:123px;border:1px solid #dae5f5;border-radius:14px;background:linear-gradient(#fff,#f8fbff);padding:3px}.variants{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:1100px}.variant{padding:8px;text-align:center;border-radius:14px;background:#fff}.variant svg{height:140px}.dark{display:flex;gap:12px;padding:15px;background:#14314a;max-width:1100px;border-radius:14px}.dark svg{width:150px;height:150px}#checks{font-size:12px;margin:12px 0;color:#125b43}
</style>
<h1>Farmodoro · creation sprite review</h1>
<p>Four distinct stages, fixed family scale, transparent background.</p>
<div class="atlas" id="atlas"><div></div><div class="heading">Started · 0%</div><div class="heading">Building · 25%</div><div class="heading">Nearly done · 60%</div><div class="heading">Complete · 100%</div></div>
<p>Palette variants</p><div class="variants" id="variants"></div>
<p>Transparency against a dark background</p><div class="dark" id="dark"></div>
<div id="checks">Checks pending</div>
<script src="./scenery-creation-art.js"></script>
<script>
try {
const art=window.SceneryCreationArt;
for(const familyId of Object.keys(art.metadata.families)){
  const label=document.createElement('div');label.className='label';label.textContent=familyId;document.querySelector('#atlas').append(label);
  for(const progress of [0,5,12,20]){const frame=document.createElement('div');frame.className='frame';frame.innerHTML=art.sprite(familyId,progress,20);document.querySelector('#atlas').append(frame)}
}
for(const id of ['blossomTree','goldenTree','pinkCoral','floweringCactus','roseCrystal']){const card=document.createElement('div');card.className='variant';card.innerHTML=art.sprite(id,20,20);card.append(document.createTextNode(id));document.querySelector('#variants').append(card)}
document.querySelector('#dark').innerHTML=['tree','pinkCoral','snowman','snowRabbit','crystal','planet'].map(id=>art.sprite(id,20,20)).join('');
const expected=[0,0,1,1,2,2,3,3];const actual=[0,4,5,11,12,19,20,21].map(p=>art.stage(p,20));
if(JSON.stringify(actual)!==JSON.stringify(expected))throw Error('Stage thresholds');
for(const id of Object.keys(art.metadata.types))for(const p of [0,5,12,20]){const output=art.sprite(id,p,20);if(!output.includes('overflow="hidden"'))throw Error('Missing clipping: '+id);if(output.includes('NaN'))throw Error('Bad geometry: '+id);}
for(const id of ['unknown','constructor','__proto__'])if(art.sprite(id)!=='')throw Error('Unknown type guard: '+id);
Promise.all(Object.values(art.metadata.atlases).map(meta=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>{if(im.naturalWidth!==meta.width||im.naturalHeight!==meta.height)reject(Error('Atlas dimensions: '+meta.src));else resolve()};im.onerror=()=>reject(Error('Atlas loading: '+meta.src));im.src=meta.src}))).then(()=>document.querySelector('#checks').textContent='PASS: 14 type IDs × 4 stages, stage boundaries, unknown-ID guards, SVG clipping, 3 loaded atlas dimensions.').catch(err=>document.querySelector('#checks').textContent='FAIL: '+err.message);
}catch(err){document.querySelector('#checks').textContent='FAIL: '+err.message;}
</script>
</html>
