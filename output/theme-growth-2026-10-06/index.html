    Promise.all(groups.map(async group => {
      const bounds=boundsByGroup[group.id];
      if(!Array.isArray(bounds)||bounds.length!==group.rows.length*4){window.growthArtErrors.push(group.id+'-bounds.json');return null}
      return new Promise(resolve => {
      const image = new Image();
      image.onload = () => {
        const w = image.naturalWidth, h = image.naturalHeight;
        for (const holder of document.querySelectorAll(`[data-art="${group.file}"]`)) {
          const theme=holder.closest('[data-theme]').dataset.theme;
          const family=bounds.filter(item=>item.theme===theme);
          const frame=family.find(item=>item.stage===Number(holder.dataset.column));
          if(!frame){window.growthArtErrors.push(theme+':'+holder.dataset.column);continue}
          const pad=4;
          const scale=82/Math.max(...family.flatMap(item=>[item.width+pad*2,item.height+pad*2]));
          const fw=frame.width+pad*2,fh=frame.height+pad*2;
          holder.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><svg x="${50-fw*scale/2}" y="${90-fh*scale}" width="${fw*scale}" height="${fh*scale}" viewBox="${frame.left-pad} ${frame.top-pad} ${fw} ${fh}" preserveAspectRatio="none" overflow="hidden"><image href="${group.file}" width="${w}" height="${h}"/></svg></svg>`;
        }
        resolve({file:group.file,width:w,height:h});
      };
      image.onerror=()=>{window.growthArtErrors.push(group.file);resolve(null)};
      image.src=group.file;
      });
    })).then(dimensions=>{window.growthArtDimensions=dimensions;window.growthArtReady=true});
    document.querySelectorAll('[data-group]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-group]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      document.querySelectorAll('.board').forEach(board=>board.hidden=button.dataset.group!=='all'&&board.id!==button.dataset.group);
    }));
    document.querySelector('#stageRange').addEventListener('input',event=>{
      const value=Number(event.target.value);
      document.querySelector('#stageOutput').value=value<0?'모든 단계':stages[value];
      document.querySelector('#boards').classList.toggle('spotlight',value>=0);
      document.querySelectorAll('.step').forEach(step=>step.classList.toggle('is-selected',Number(step.dataset.stage)===value));
    });
  </script>
